  <body>
    <!-- Apply theme before React renders to prevent flash and ensure correct initial state -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
